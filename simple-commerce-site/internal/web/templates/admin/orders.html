{{define "content"}}
<section class="panel">
  <div class="section-head">
    <h2>订单列表</h2>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>订单号</th>
          <th>客户</th>
          <th>手机号</th>
          <th>状态</th>
          <th>金额</th>
          <th>创建时间</th>
        </tr>
      </thead>
      <tbody>
        {{range .Orders}}
        <tr>
          <td>{{.Number}}</td>
          <td>{{.CustomerName}}</td>
          <td>{{.Phone}}</td>
          <td>{{.Status}}</td>
          <td>{{money .TotalCents}}</td>
          <td>{{date .CreatedAt}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</section>
{{end}}
