{{define "content"}}
<section class="admin-grid single">
  <div class="panel">
    <div class="section-head">
      <h2>新增商品</h2>
    </div>
    <form class="admin-form" method="post" action="/admin/products">
      <label>商品名<input name="name" placeholder="如：夏日凉鞋"></label>
      <label>Slug<input name="slug" placeholder="如：summer-shoes"></label>
      <label>分类<input name="category" placeholder="如：服饰"></label>
      <label>价格（分）<input name="price_cents" type="number" min="0" value="0"></label>
      <label>库存<input name="stock" type="number" min="0" value="0"></label>
      <label>图片地址<input name="image_url" placeholder="https://..."></label>
      <label class="full">描述<textarea name="description" rows="4" placeholder="简要描述"></textarea></label>
      <label class="check full">
        <input type="checkbox" name="featured">
        设为精选商品
      </label>
      <button class="button primary" type="submit">保存商品</button>
    </form>
  </div>

  <div class="panel">
    <div class="section-head">
      <h2>商品列表</h2>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>商品</th>
            <th>分类</th>
            <th>价格</th>
            <th>库存</th>
          </tr>
        </thead>
        <tbody>
          {{range .Products}}
          <tr>
            <td>{{.Name}}</td>
            <td>{{.Category}}</td>
            <td>{{money .PriceCents}}</td>
            <td>{{.Stock}}</td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</section>
{{end}}
