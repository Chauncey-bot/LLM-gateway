{{define "base"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{if .Title}}{{.Title}} - {{end}}Simple Commerce</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="{{.Section}}">
  <div class="shell">
    {{if eq .Section "storefront"}}
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">SC</span>
          <span>Simple Commerce</span>
        </a>
        <nav class="nav">
          <a class="{{if eq .Active "home"}}active{{end}}" href="/">首页</a>
          <a class="{{if eq .Active "catalog"}}active{{end}}" href="/catalog">商品</a>
          <a class="{{if eq .Active "cart"}}active{{end}}" href="/cart">购物车</a>
          <a class="{{if eq .Active "orders"}}active{{end}}" href="/orders">订单管理</a>
          <a href="/admin/">管理后台</a>
        </nav>
      </header>
    {{else if eq .Section "admin"}}
      <header class="topbar adminbar">
        <a class="brand" href="/admin/">
          <span class="brand-mark">AD</span>
          <span>店铺管理端</span>
        </a>
        <nav class="nav">
          <a class="{{if eq .Active "dashboard"}}active{{end}}" href="/admin/">概览</a>
          <a class="{{if eq .Active "products"}}active{{end}}" href="/admin/products">商品</a>
          <a class="{{if eq .Active "orders"}}active{{end}}" href="/admin/orders">订单管理</a>
          <a href="/">返回前台</a>
        </nav>
      </header>
    {{end}}

    <main class="content">
      {{template "content" .}}
    </main>
  </div>
</body>
</html>
{{end}}
