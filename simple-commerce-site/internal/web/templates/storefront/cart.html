{{define "content"}}
<section class="page-head">
  <div>
    <p class="eyebrow">购物车</p>
    <h1>确认订单</h1>
  </div>
</section>

{{if .Cart}}
<div class="cart-layout">
  <div class="cart-list">
    {{range .Cart}}
    <article class="cart-item">
      <img src="{{.Product.ImageURL}}" alt="{{.Product.Name}}">
      <div>
        <h3>{{.Product.Name}}</h3>
        <p>{{.Quantity}} 件 · {{money .Product.PriceCents}} / 件</p>
      </div>
      <strong>{{money .LineTotal}}</strong>
    </article>
    {{end}}
  </div>

  <aside class="summary">
    <h2>订单信息</h2>
    <div class="summary-row">
      <span>商品小计</span>
      <strong>{{money .Subtotal}}</strong>
    </div>
    <div class="summary-row">
      <span>运费</span>
      <strong>{{money .Shipping}}</strong>
    </div>
    <div class="summary-row total">
      <span>应付</span>
      <strong>{{money .Total}}</strong>
    </div>

    <form class="checkout-form" method="post" action="/checkout">
      <label>
        收货人
        <input name="customer_name" placeholder="请输入姓名">
      </label>
      <label>
        手机号
        <input name="phone" placeholder="请输入手机号">
      </label>
      <label>
        地址
        <textarea name="address" rows="3" placeholder="请输入收货地址"></textarea>
      </label>
      <button class="button primary" type="submit">提交订单</button>
    </form>
  </aside>
</div>
{{else}}
<div class="empty-state">
  <h2>购物车还是空的</h2>
  <p>先去挑选一些商品吧。</p>
  <a class="button primary" href="/catalog">去逛逛</a>
</div>
{{end}}
{{end}}
