services:
  subscription-reset-service:
    image: subscription-reset-service:latest
    build:
      context: ..
      dockerfile: subscription-reset-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18192:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sub2api-net

networks:
  sub2api-net:
    external: true
    name: sub2api_sub2api-network
