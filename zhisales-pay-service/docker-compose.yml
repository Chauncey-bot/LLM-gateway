services:
  zhisales-pay:
    image: zhisales-pay-service:latest
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18190:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./catalog.json:/app/catalog.json
    networks:
      - sub2api-net

networks:
  sub2api-net:
    external: true
    name: sub2api-v01104-official_sub2api-network
